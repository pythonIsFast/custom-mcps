name: Build and release MCP executables

# Produces portable Windows x64 executables and publishes a release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - inventor_mcp_server.py
      - moodle_mcp_server.py
      - installer_manager.py
      - installer_ui/**
      - tests/**
      - VERSION
      - .github/release.yml
      - .github/workflows/build-inventor-exe.yml

permissions:
  contents: write

concurrency:
  group: mcp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and release Windows executables
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mcp[cli]" "fastmcp>=3,<4" requests beautifulsoup4 keyring pywin32 pyinstaller "pywebview>=5.4,<7"

      - name: Validate sources
        shell: pwsh
        run: |
          python -m py_compile inventor_mcp_server.py moodle_mcp_server.py installer_manager.py
          python -m unittest discover -s tests -v

      - name: Build Inventor executable
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name inventor-mcp-server `
            --hidden-import win32timezone `
            --hidden-import win32com.gen_py `
            inventor_mcp_server.py

      - name: Build Moodle executable
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name moodle-mcp-server `
            --hidden-import tkinter `
            --collect-submodules keyring.backends `
            moodle_mcp_server.py

      - name: Build installer manager
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name custom-mcp-manager `
            --add-data "installer_ui;installer_ui" `
            --hidden-import win32com.client `
            --hidden-import win32timezone `
            --collect-all webview `
            installer_manager.py

      - name: Verify executables
        shell: pwsh
        run: |
          $artifacts = @(
            "dist/inventor-mcp-server.exe",
            "dist/moodle-mcp-server.exe",
            "dist/custom-mcp-manager.exe"
          )
          foreach ($path in $artifacts) {
            $artifact = Get-Item -LiteralPath $path
            Write-Host "Built $($artifact.FullName) ($($artifact.Length) bytes)"
            Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $checksums = Get-ChildItem -LiteralPath dist -Filter "*.exe" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding utf8NoBOM
          Get-Content -LiteralPath "dist/SHA256SUMS.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-mcp-servers-windows-x64
          path: |
            dist/inventor-mcp-server.exe
            dist/moodle-mcp-server.exe
            dist/custom-mcp-manager.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $series = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          if ($series -notmatch '^\d+\.\d+$') {
            throw "VERSION must contain a major.minor release series, for example 0.2"
          }
          $tag = "v$series.$env:GITHUB_RUN_NUMBER"
          $title = "Custom MCPs $tag"
          $previousTag = git tag --merged $env:GITHUB_SHA --sort=-creatordate |
            Select-Object -First 1
          $range = if ($previousTag) {
            "$previousTag..$env:GITHUB_SHA"
          } else {
            $env:GITHUB_SHA
          }

          $groups = [ordered]@{
            "✨ New features" = [System.Collections.Generic.List[string]]::new()
            "🐛 Fixes" = [System.Collections.Generic.List[string]]::new()
            "📚 Documentation" = [System.Collections.Generic.List[string]]::new()
            "🧰 Maintenance" = [System.Collections.Generic.List[string]]::new()
          }
          $commitLines = git log $range --format="%H`t%h`t%s"
          foreach ($line in $commitLines) {
            $parts = $line -split "`t", 3
            if ($parts.Count -ne 3) {
              continue
            }
            $fullSha, $shortSha, $subject = $parts
            $cleanSubject = $subject -replace '^(feat|fix|docs|chore|ci|build|test|refactor)(\([^)]+\))?!?:\s*', ''
            $entry = "- $cleanSubject ([$shortSha](https://github.com/$env:GITHUB_REPOSITORY/commit/$fullSha))"
            if ($subject -match '^feat(\([^)]+\))?!?:') {
              $groups["✨ New features"].Add($entry)
            } elseif ($subject -match '^fix(\([^)]+\))?!?:') {
              $groups["🐛 Fixes"].Add($entry)
            } elseif ($subject -match '^docs(\([^)]+\))?!?:') {
              $groups["📚 Documentation"].Add($entry)
            } else {
              $groups["🧰 Maintenance"].Add($entry)
            }
          }

          $changelogSections = [System.Collections.Generic.List[string]]::new()
          foreach ($group in $groups.GetEnumerator()) {
            if ($group.Value.Count -eq 0) {
              continue
            }
            $changelogSections.Add("### $($group.Key)")
            foreach ($entry in $group.Value) {
              $changelogSections.Add($entry)
            }
            $changelogSections.Add("")
          }
          $changelog = $changelogSections -join "`n"
          $comparison = if ($previousTag) {
            "https://github.com/$env:GITHUB_REPOSITORY/compare/$previousTag...$tag"
          } else {
            "https://github.com/$env:GITHUB_REPOSITORY/commits/$tag"
          }
          $notes = @"
          ## 📦 Downloads

          | File | Purpose |
          | --- | --- |
          | **custom-mcp-manager.exe** | Recommended installer and client configuration UI |
          | **inventor-mcp-server.exe** | Autodesk Inventor MCP server |
          | **moodle-mcp-server.exe** | Moodle MCP server |
          | **SHA256SUMS.txt** | SHA-256 checksums for all executables |

          ## 🔐 Verify your download

          ``````powershell
          Get-FileHash .\custom-mcp-manager.exe -Algorithm SHA256
          Get-Content .\SHA256SUMS.txt
          ``````

          ## 📝 Changelog

          $changelog
          **[Full changelog]($comparison)**

          > [!IMPORTANT]
          > These binaries are experimental. Test them before using important
          > Moodle data or production CAD documents.
          "@
          $notes | Set-Content -LiteralPath "release-notes.md" -Encoding utf8NoBOM

          gh release create $tag `
            "dist/inventor-mcp-server.exe" `
            "dist/moodle-mcp-server.exe" `
            "dist/custom-mcp-manager.exe" `
            "dist/SHA256SUMS.txt" `
            --target $env:GITHUB_SHA `
            --title $title `
            --notes-file "release-notes.md"
