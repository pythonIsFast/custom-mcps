name: Build and release MCP executables

# Produces portable Windows x64 executables and publishes a release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - inventor_mcp_server.py
      - moodle_mcp_server.py
      - .github/workflows/build-inventor-exe.yml

permissions:
  contents: write

concurrency:
  group: mcp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and release Windows executables
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mcp[cli]" "fastmcp>=3,<4" requests beautifulsoup4 keyring pywin32 pyinstaller

      - name: Validate sources
        shell: pwsh
        run: python -m py_compile inventor_mcp_server.py moodle_mcp_server.py

      - name: Build Inventor executable
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name inventor-mcp-server `
            --hidden-import win32timezone `
            --hidden-import win32com.gen_py `
            inventor_mcp_server.py

      - name: Build Moodle executable
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name moodle-mcp-server `
            --hidden-import tkinter `
            --collect-submodules keyring.backends `
            moodle_mcp_server.py

      - name: Verify executables
        shell: pwsh
        run: |
          $artifacts = @(
            "dist/inventor-mcp-server.exe",
            "dist/moodle-mcp-server.exe"
          )
          foreach ($path in $artifacts) {
            $artifact = Get-Item -LiteralPath $path
            Write-Host "Built $($artifact.FullName) ($($artifact.Length) bytes)"
            Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-mcp-servers-windows-x64
          path: |
            dist/inventor-mcp-server.exe
            dist/moodle-mcp-server.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "build-$env:GITHUB_RUN_NUMBER-$shortSha"
          $title = "Custom MCP Servers build $env:GITHUB_RUN_NUMBER"
          $notes = @"
          Automated Windows x64 build from commit $env:GITHUB_SHA.

          Included executables:
          - inventor-mcp-server.exe
          - moodle-mcp-server.exe

          These binaries are experimental. Test them before using important
          Moodle data or production CAD documents.
          "@

          gh release create $tag `
            "dist/inventor-mcp-server.exe" `
            "dist/moodle-mcp-server.exe" `
            --target $env:GITHUB_SHA `
            --title $title `
            --notes $notes
