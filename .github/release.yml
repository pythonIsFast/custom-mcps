changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "✨ New features"
      labels:
        - enhancement
        - feature
    - title: "🐛 Fixes"
      labels:
        - bug
        - fix
    - title: "📚 Documentation"
      labels:
        - documentation
    - title: "🧰 Maintenance"
      labels:
        - "*"
